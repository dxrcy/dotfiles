[mgr]
prepend_keymap = [
    # Esperanto keys
    { on = [ "ŝ" ], run = "quit", desc = "Quit (eo)" },
    { on = [ "ĉ" ], run = "yank --cut", desc = "Cut (eo)" },

    # Copy
    # { on = [ "c", "f" ], run = "shell --confirm 'wl-copy $@'", desc = "Copy file to clipboard" },
    { on = [ "c", "c" ], run = "shell --confirm 'cat $@ | wl-copy'", desc = "Copy text to clipboard" },

    # Jump
    { on = [ "~" ], run = "cd ~" },
    { on = [ ":" ], run = "cd --interactive", desc = "Jump interactively" },

    # Rename
    { on = "R", run = "rename --empty=all", desc = "Rename (empty)" },

    { on = [ "H" ], run = "help" },
]

